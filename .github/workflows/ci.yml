name: MathModel-AI v2 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system tools (pdfinfo for page metrics)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s mathmodel-skill/tests -p 'test_*.py'
      - name: Run isolated fixture benchmark
        run: python benchmarks/run_fixture_benchmark.py
