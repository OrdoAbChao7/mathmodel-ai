profile_id: cumcm-2026
rule_version: CUMCM-2026-v1
effective_date: 2026-01-01
source_title: CUMCM competition compliance profile
verified_at: 2026-09-01
formal_modes:
  - competition_assisted
  - competition_max
required_human_gates:
  - H1_PROBLEM_UNDERSTANDING
  - H2_METHOD_SELECTION
  - H3_RESULT_VERIFICATION
  - H4_FINAL_SUBMISSION
minimum_independent_interpretations: 2
major_conflict_dimensions:
  - objectives
  - decision_variables
  - hard_constraints
  - outputs
  - dependencies
model_tournament:
  minimum_total_candidates: 4
  minimum_non_baseline_routes: 3
  maximum_non_baseline_routes: 5
  risk_fields:
    - assumption_fit
    - data_sufficiency
    - data_quality
    - implementation_feasibility
    - solver_availability
    - runtime_feasibility
    - parameter_identifiability
    - output_degeneracy
    - leakage_risk
    - sensitivity_risk
    - validation_feasibility
    - baseline_plausibility
competition_max:
  evidence_artifact: artifacts/competition-max-review.json
  depth_record_fields:
    model_scouts: model_scout_records
    candidate_routes_reviewed: candidate_route_records
    red_team_rounds: red_team_round_records
  minimum_model_scouts: 2
  minimum_candidate_routes_reviewed: 4
  minimum_red_team_rounds: 2
  required_robustness_attacks:
    - alternative_split
    - extreme_scenario
    - bootstrap
  required_external_review_provider: ars
validation_requirements:
  forecasting:
    - chronological_split
    - leakage_check
    - baseline
    - metric_recomputation
  optimization:
    - solver_status
    - feasibility
    - constraint_violation
    - objective_recomputation
    - baseline_policy
  evaluation:
    - indicator_direction
    - normalization
    - weight_provenance
    - ranking_stability
  simulation:
    - seed
    - replications
    - convergence
    - uncertainty_interval
  mechanism:
    - units
    - boundary_behavior
    - parameter_plausibility
    - calibration
  hybrid:
    - baseline
    - leakage_check
    - feasibility
    - objective_recomputation
    - validation_feasibility
experiment_provenance:
  evidence_artifact: artifacts/experiment-registry.json
  required_fields:
    - run_id
    - question_id
    - model_id
    - code_hashes
    - input_hashes
    - config_hash
    - seed
    - environment
    - started_at
    - ended_at
    - metrics
    - figures
    - result_artifacts
